name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新提交取消上一次仍在跑的流水线
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 与 backend/Dockerfile、frontend/Dockerfile 的 node:22-slim 对齐
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 锁文件与 package.json 不一致会在这里失败
      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  backend:
    name: backend (prisma · build · test)
    runs-on: ubuntu-latest
    # prisma validate / generate 只解析 schema，从不连库；但 schema 里的
    # datasource url = env("DATABASE_URL") 要求该变量「已定义」，否则报 P1012。
    # backend/.env 被 gitignore，CI 上不存在，所以在此给一个占位值。
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # schema.prisma 语法/关系合法性校验，不需要连库
      - run: npx prisma validate

      - run: pnpm run prisma:generate
      - run: pnpm run build
      - run: pnpm test
      # 注：backend/package.json 目前没有 lint 脚本，故此处不设 lint 门禁。
