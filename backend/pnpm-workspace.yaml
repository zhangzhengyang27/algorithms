# pnpm 配置（backend）
# - verifyDepsBeforeRun: false  关闭运行时 deps 校验，否则 Docker 里 pnpm run 会因非 TTY 直接报错退出
# - 依赖构建脚本白名单在 package.json 的 pnpm.onlyBuiltDependencies 里维护。
#   不要在此再加 dangerouslyAllowAllBuilds：pnpm 10 会与 onlyBuiltDependencies 判定为
#   「同时设置 neverBuiltDependencies 与 onlyBuiltDependencies」，导致 pnpm install 直接失败。
verifyDepsBeforeRun: false
