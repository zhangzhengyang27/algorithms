# 算法可视化学习平台 · NAS Docker 部署
# 架构：浏览器 → (frp/VPS) → frontend(:4000) → rewrites 同源代理 → backend(:40001) → dev-stack PG16(192.168.1.18:5433)
#
# 说明：
# - PostgreSQL 复用 NAS 上已有的 dev-stack PostgreSQL 16（不在本 compose 管理），
#   后端通过 backend/.env 的 DATABASE_URL 直连 192.168.1.18:5433。
# - 首次部署需在 dev-stack PG 中先建库 `algo_platform`（migrate deploy 只建表不建库）。
# - 前端 build 时不传 NEXT_PUBLIC_API_URL，运行时由下方 environment 注入 http://backend:40001 做同源代理。
# - NODE_ENV=production 时登录 cookie 带 secure，需经 HTTPS（VPS Nginx+Certbot）访问。
# - TRUST_PROXY=1 必设，后端限流按 X-Forwarded-For 取真实 IP。

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:40001:40001"   # 仅宿主本地调试用，不对公网
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:40001   # 仅运行时注入，供 next.config rewrites 代理
      PORT: "4000"
    ports:
      - "4000:4000"                # NAS 宿主 4000，再由 frp 代理到 VPS 公网
    depends_on:
      - backend
    restart: unless-stopped
